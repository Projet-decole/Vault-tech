# Porte d'entrée unique : Superset, la carte et les tuiles sous la même adresse (http://localhost:8090).
#
# Pourquoi : un navigateur interdit à une page dans une iframe de lire la page qui l'entoure si elles
# viennent de deux adresses différentes (ports compris). En servant tout depuis la même adresse, la carte
# (dans son iframe) peut lire les filtres du dashboard Superset, et inversement les modifier.
#
#   /          → Superset            (le dashboard : http://localhost:8090/superset/dashboard/prospection/)
#   /carte/    → la page MapLibre    (fichiers statiques)
#   /tuiles/   → Martin              (tuiles vectorielles)

# DNS interne de Docker : nécessaire quand proxy_pass contient une variable ($chemin)
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    client_max_body_size 50m;

    location = /carte { return 301 /carte/; }
    location /carte/ {
        alias /usr/share/nginx/html/;
    }

    # Doc Martin « Using with NGINX » : X-Rewrite-URL pour que ses TileJSON pointent vers /tuiles/...
    location ~ ^/tuiles/(?<chemin>.*)$ {
        proxy_set_header X-Rewrite-URL $uri;
        # $http_host = l'adresse tapée par le navigateur (localhost:8090), pas le port interne du conteneur (80)
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://martin:3000/$chemin$is_args$args;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # requêtes lourdes de SQL Lab
        proxy_pass http://superset:8088;
    }
}
